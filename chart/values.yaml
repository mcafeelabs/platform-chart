# Defaults only. Real values are generated by svcreg (rendered/<env>/<svc>/values.yaml).
service:
  name: ""
  owner: ""
  # http-api | worker (see capabilities.yaml)
  profile: http-api
  environment: ""
  namespace: ""
  wave: 0
  sandbox:
    # Set when rendering for a sandbox; switches on the sandbox profile.
    name: ""
    baselineNamespace: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

platform:
  # local: in-cluster stand-ins (postgres StatefulSet, queue stubs).
  # crossplane: claims for the platform's Crossplane compositions.
  provisioner: local
  rollouts:
    enabled: false
  sandbox:
    nodePool:
      enabled: false
      # Karpenter NodePool with a sandbox taint.
      selector: {platform.mcafeelabs.io/pool: sandbox}
      taint: {key: sandbox, value: "true", effect: NoSchedule}

deployment:
  replicas: 1
  port: 8080
  resources: {}
  env: []
  rollout:
    steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 50
      - pause: {duration: 30s}

# Resources the service provides, with names resolved by svcreg.
outputs: []

# Resolved config (references left as $secret/$kv maps); informational.
config: {}

# config.yaml as an ExternalSecret template plus the references it needs.
# Without references the template is the literal file.
configFile:
  template: ""
  refs: []

postgres:
  image: postgres:17-alpine
  storage: 1Gi
